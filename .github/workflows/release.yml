name: Build/release (Windows)

on:
  push:
    tags:
      - 'V*.*.*'  # 仅匹配大写V开头的标签（如V1.0.0）
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:  # 显式声明权限（关键：解决GH_TOKEN权限不足）
      contents: write  # 必须！授予发布Releases的权限
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整提交记录（Electron Builder需要）

      - name: Set up Node.js & Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'yarn'
          registry-url: https://registry.npmmirror.com/

      - name: Install dependencies
        run: |
          yarn cache clean
          yarn install
          Write-Host "✅ 依赖安装完成"
        shell: pwsh

      # 核心：构建+输出详细日志（排查发布失败原因）
      - name: Build Electron app (详细日志)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_PLATFORM: win32
          ELECTRON_BUILDER_ARCH: x64
          DEBUG: electron-builder  # 开启Electron Builder调试日志（关键）
        run: |
          # 执行构建，输出完整日志
          Write-Host "=== 开始构建并发布到Releases ==="
          yarn build --publish always 2>&1
          # 检查构建退出码
          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ 构建/发布失败，退出码：$LASTEXITCODE"
              exit $LASTEXITCODE
          }
          # 验证产物是否生成（必须有产物才能发布）
          Write-Host "=== 验证构建产物 ==="
          if (-not (Test-Path "dist")) {
              Write-Host "❌ dist目录不存在，无产物可发布"
              exit 1
          }
          # 列出dist目录所有文件（确认有.exe/.zip等产物）
          Get-ChildItem "dist" -Recurse
        shell: pwsh

      # 兜底：如果Electron Builder自动发布失败，手动上传产物到Releases
      - name: Manual upload to Releases (兜底)
        uses: softprops/action-gh-release@v2  # 官方推荐的Releases上传Action
        if: always()  # 即使自动发布失败，也执行
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.msi
          tag_name: ${{ github.ref_name }}  # 匹配推送的标签（如V1.0.0）
          name: Release ${{ github.ref_name }}  # Releases名称
          body: "Windows平台自动构建产物"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
