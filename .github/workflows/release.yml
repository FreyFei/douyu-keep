name: Build/release
on:
  push:
    tags: ['V*.*.*']
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with: fetch-depth: 0

      - name: Set up Node.js & Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'yarn'
          registry-url: https://registry.npmmirror.com/

      - name: 🧹 清理缓存 + 重装依赖（解决chalk等依赖缺失）
        run: |
          # 清除yarn缓存，避免缓存污染
          yarn cache clean
          # 严格按lockfile安装依赖（确保CI和本地一致）
          yarn install --frozen-lockfile
          # 验证chalk是否安装成功（核心依赖）
          Write-Host "=== 验证chalk模块 ==="
          node -e "require('chalk'); console.log('✅ chalk安装成功')" 2>&1 || (Write-Host "❌ chalk安装失败"; exit 1)

      - name: 📝 分步执行构建（精准定位失败环节）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "=== 第一步：执行build.js脚本 ==="
          # 单独执行build.js，捕获完整错误日志
          node scripts/build.js 2>&1
          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ build.js执行失败，退出码：$LASTEXITCODE"
              exit $LASTEXITCODE
          }

          Write-Host "=== 第二步：执行electron-builder打包 ==="
          # 单独执行打包，指定Windows平台/64位架构
          electron-builder --publish always --win --x64 2>&1
          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ electron-builder打包失败，退出码：$LASTEXITCODE"
              exit $LASTEXITCODE
          }

      - name: 📂 检查构建产物（PowerShell兼容）
        run: |
          Write-Host "=== 构建产物目录列表 ==="
          # 检查dist目录
          if (Test-Path -Path "dist" -PathType Container) { 
              Get-ChildItem -Path "dist" -Recurse; 
          } else { 
              Write-Host "⚠️ dist目录不存在"; 
          }
          # 额外检查electron-builder常见产物目录
          if (Test-Path -Path "release" -PathType Container) { 
              Get-ChildItem -Path "release" -Recurse; 
          } else { 
              Write-Host "⚠️ release目录不存在"; 
          }

      - name: 📤 上传产物/日志（失败也上传，方便排障）
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-${{ github.sha }}
          path: |
            dist/**/*
            release/**/*
            node_modules/**/*.log
          retention-days: 7
