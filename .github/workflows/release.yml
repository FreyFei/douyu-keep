name: Build/release

on:
  push:
    tags: ['V*.*.*']
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: 拉取代码（完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 避免Electron Builder缺失版本信息

      - name: 配置Node.js + 国内镜像（加速依赖安装）
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'yarn'
          registry-url: https://registry.npmmirror.com/

      - name: 安装依赖（验证chalk是否安装）
        run: |
          # 清理缓存+重装依赖，避免缓存污染
          yarn cache clean
          yarn install --frozen-lockfile
          # 验证chalk是否安装成功（提前发现问题）
          Write-Host "=== 验证chalk依赖 ==="
          node -e "require('chalk'); Write-Host '✅ chalk安装成功'" 2>&1 || (Write-Host '❌ chalk安装失败'; exit 1)

      - name: 分步执行构建（精准定位失败环节）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 修复TOKEN大小写（关键）
          ELECTRON_BUILDER_PLATFORM: win32
        run: |
          Write-Host "=== 第一步：执行build.js脚本 ==="
          # 单独执行build.js，输出详细错误
          node scripts/build.js 2>&1
          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ build.js执行失败，退出码：$LASTEXITCODE"
              exit $LASTEXITCODE
          }

          Write-Host "=== 第二步：执行electron-builder打包 ==="
          electron-builder --publish always --win --x64 2>&1
          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ electron-builder打包失败，退出码：$LASTEXITCODE"
              exit $LASTEXITCODE
          }

      - name: 检查产物目录
        run: |
          Write-Host "=== 构建产物目录检查 ==="
          if (Test-Path "dist") { Get-ChildItem "dist" -Recurse } else { Write-Host "⚠️ dist目录不存在" }
          if (Test-Path "release") { Get-ChildItem "release" -Recurse } else { Write-Host "⚠️ release目录不存在" }

      - name: 上传产物/日志（失败也上传，方便排查）
        uses: actions/upload-artifact@v4
        if: always()  # 无论成功/失败都执行
        with:
          name: douyu-keep-build-${{ github.ref_name }}
          path: |
            dist/**/*
            release/**/*
            node_modules/**/*.log  # 上传日志文件
          retention-days: 7
