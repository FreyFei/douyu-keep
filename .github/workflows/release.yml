name: Build/release

on:
  push:
    tags: ['V*.*.*']
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: 拉取代码（完整历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置Node.js + 国内镜像
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'yarn'
          registry-url: https://registry.npmmirror.com/

      - name: 安装依赖（移除--frozen-lockfile，允许更新lockfile）
        run: |
          # 清理缓存，避免污染
          yarn cache clean
          # 移除--frozen-lockfile，解决lockfile不匹配报错
          yarn install
          # 验证yarn安装是否成功
          Write-Host "=== 已安装的依赖列表（含chalk）==="
          yarn list chalk  # 直接列出chalk依赖，确认安装

      - name: 验证chalk依赖（正确判断node进程退出码）
        run: |
          Write-Host "=== 验证chalk依赖 ==="
          # 执行node命令，捕获退出码（PowerShell中$LASTEXITCODE对应外部进程退出码）
          node -e "require('chalk')"
          if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ chalk安装成功"
          } else {
              Write-Host "❌ chalk安装失败，退出码：$LASTEXITCODE"
              exit 1  # 验证失败，终止流程
          }

      - name: 分步执行构建
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 确保大写，权限正常
          ELECTRON_BUILDER_PLATFORM: win32
        run: |
          Write-Host "=== 第一步：执行build.js脚本 ==="
          node scripts/build.js
          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ build.js执行失败，退出码：$LASTEXITCODE"
              exit $LASTEXITCODE
          }

          Write-Host "=== 第二步：执行electron-builder打包 ==="
          electron-builder --publish always --win --x64
          if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ electron-builder打包失败，退出码：$LASTEXITCODE"
              exit $LASTEXITCODE
          }

      - name: 检查产物目录
        run: |
          Write-Host "=== 构建产物目录检查 ==="
          if (Test-Path "dist") {
              Get-ChildItem "dist" -Recurse
          } else {
              Write-Host "⚠️ dist目录不存在"
          }

      - name: 上传产物/日志（失败也上传）
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: douyu-keep-build-${{ github.ref_name }}
          path: |
            dist/**/*
            release/**/*
          retention-days: 7
