name: Build/release

on:
  push:
    tags:
      - 'V*.*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js & Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'yarn'
          registry-url: https://registry.npmmirror.com/

      - name: 🔍 检查依赖配置（排障用）
        run: |
          # 打印package.json中的依赖（确认chalk已声明）
          cat package.json | findstr "chalk" || echo "chalk未在package.json中声明"
          # 打印yarn版本和node版本
          yarn --version
          node --version

      - name: Install dependencies（强制重装，避免缓存问题）
        run: |
          # 清除yarn缓存（防止缓存污染）
          yarn cache clean
          # 安装所有依赖（包括新添加的chalk），不锁定lockfile（先确保依赖装全）
          yarn install
          # 验证chalk是否安装成功
          echo "=== 验证chalk模块 ==="
          node -e "require('chalk'); console.log('chalk安装成功')" || echo "chalk安装失败"

      - name: Build Electron app & publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_PLATFORM: win32
          ELECTRON_BUILDER_ARCH: x64
        run: |
          # 先执行build脚本，捕获详细日志
          yarn build --publish always
          # 打印产物目录（确认是否生成）
          echo "=== 构建产物目录列表 ==="
          if (Test-Path dist/) { dir dist/ } else { echo "dist目录不存在" }
          if (Test-Path release/) { dir release/ } else { echo "release目录不存在" }
          echo "=== 构建产物列表结束 ==="

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success() || failure()  # 即使构建失败，也上传日志（方便排障）
        with:
          name: douyu-keep-windows-build-${{ github.ref_name }}
          path: |
            dist/**/*
            release/**/*
            !**/node_modules/
          retention-days: 30
          if-no-files-found: warn
