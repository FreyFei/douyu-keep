name: Build/release

on:
  push:
    tags:
      - 'V*.*.*'  # 仅匹配大写V开头的版本标签（如V1.0.0）
  workflow_dispatch:  # 支持手动触发

jobs:
  release:
    runs-on: windows-2022  # 精简matrix，直接指定Windows 2022
    timeout-minutes: 30  # 防止构建卡死，超时终止
    steps:
      # 1. 拉取代码（完整历史，Electron Builder可能需要）
      - name: Check out code
        uses: actions/checkout@v4  # 升级到最新版Action，更稳定
        with:
          fetch-depth: 0  # 拉取完整提交记录，避免版本信息缺失

      # 2. 配置Node.js + 国内镜像（解决依赖下载失败）
      - name: Set up Node.js & Yarn
        uses: actions/setup-node@v4  # 升级到最新版Action
        with:
          node-version: 18  # 固定Node版本（匹配Electron兼容版本）
          cache: 'yarn'  # 缓存yarn依赖，加速构建
          registry-url: https://registry.npmmirror.com/  # 国内镜像，避免依赖下载超时

      # 3. 安装依赖（清理缓存+验证安装）
      - name: Install dependencies
        run: |
          yarn cache clean  # 清除缓存，避免依赖污染
          yarn install --frozen-lockfile  # 锁定依赖版本，确保构建一致
          # 验证依赖安装成功（打印版本，方便排查）
          yarn --version
          node --version

      # 4. 构建+发布（修复TOKEN权限+输出详细日志）
      - name: Build Electron app & publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 修复大小写：官方默认大写TOKEN
          ELECTRON_BUILDER_PLATFORM: win32  # 强制指定Windows平台
          ELECTRON_BUILDER_ARCH: x64  # 强制64位构建
        run: |
          # 执行构建+发布，输出详细日志（关键：排查失败原因）
          yarn build --publish always
          # 打印产物目录（核心：确认是否生成文件）
          echo "=== 构建产物目录检查 ==="
          if (Test-Path "dist") { Get-ChildItem "dist" -Recurse } else { echo "dist目录不存在" }
          if (Test-Path "release") { Get-ChildItem "release" -Recurse } else { echo "release目录不存在" }

      # 5. 上传Artifacts（兜底：即使Releases发布失败，也能下载产物）
      - name: Upload build artifacts (fallback)
        uses: actions/upload-artifact@v4
        if: always()  # 无论构建/发布成功与否，都上传
        with:
          name: douyu-keep-windows-${{ github.ref_name }}  # 产物名带版本（如V1.0.0）
          path: |
            dist/**/*  # Electron Builder默认产物目录
            release/**/*  # 兼容部分项目的产物目录
            !**/node_modules/  # 排除无用依赖，减小体积
          retention-days: 30  # 产物保留30天
