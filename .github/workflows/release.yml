name: Build/release (Windows)

on:
  push:
    tags:
      - 'V*.*.*'  # 推送V开头标签触发
  workflow_dispatch:  # 支持手动触发

jobs:
  release:
    runs-on: windows-2022  # 仅保留Windows 2022
    timeout-minutes: 30    # Windows构建超时时间

    steps:
      # 1. 拉取代码（完整历史，避免Electron版本信息缺失）
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 配置Node.js + 国内镜像（加速依赖安装）
      - name: Set up Node.js & Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'yarn'  # 缓存依赖，减少重复下载
          registry-url: https://registry.npmmirror.com/

      # 3. 安装依赖（PowerShell原生语法）
      - name: Install dependencies
        run: |
          yarn cache clean
          yarn install
          # 验证yarn安装结果
          Write-Host "✅ 依赖安装完成，当前yarn版本：$(yarn --version)"
        shell: pwsh

      # 4. 构建+发布到Releases（核心步骤）
      - name: Build & publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 大写确保发布权限
          ELECTRON_BUILDER_PLATFORM: win32       # 强制Windows平台
          ELECTRON_BUILDER_ARCH: x64             # 强制64位构建
        run: |
          # 执行构建并发布到Releases
          yarn build --publish always
          # PowerShell原生语法检查产物目录
          Write-Host "=== 构建产物目录检查 ==="
          if (Test-Path "dist") {
              Get-ChildItem "dist" -Recurse  # 列出dist下所有文件
          } else {
              Write-Host "⚠️ dist目录不存在"
          }
        shell: pwsh

      # 5. 兜底：上传Artifacts（即使Releases发布失败也能下载）
      - name: Upload build artifacts (fallback)
        uses: actions/upload-artifact@v4
        if: always()  # 无论成功/失败都执行
        with:
          name: douyu-keep-windows-${{ github.ref_name }}  # 产物名带版本
          path: dist/**/*  # 上传所有构建产物
          retention-days: 30  # 产物保留30天
